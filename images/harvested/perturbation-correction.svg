<svg role="img" aria-labelledby="t-perturbation-correction" viewBox="0 0 560 416" xmlns="http://www.w3.org/2000/svg">
  <title id="t-perturbation-correction">Energy correction in time-independent perturbation theory</title>
  <desc>An unperturbed energy level E⁰ shifts to a corrected value as successive terms in the lambda power series are added: first the first-order term, then the second-order term, converging on the exact energy.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 3</provenance></metadata>
  <defs>
    <marker id="ar-pc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="416" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Energy correction: E = E⁰ + λE¹ + λ²E² + …</text>
  <rect x="28" y="52" width="504" height="288" fill="#F5F5F5" stroke="#D4D4D4"/>
  <line x1="80" y1="320" x2="80" y2="70" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#ar-pc)"/>
  <text x="56" y="80" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E</text>
  <line x1="120" y1="280" x2="220" y2="280" stroke="#2a1a0e" stroke-width="2"/>
  <text x="125" y="297" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E⁰</text>
  <line x1="240" y1="210" x2="340" y2="210" stroke="#787878" stroke-width="2"/>
  <text x="245" y="227" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E⁰+λE¹</text>
  <line x1="360" y1="186" x2="460" y2="186" stroke="#787878" stroke-width="2"/>
  <text x="365" y="203" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">+λ²E²</text>
  <line x1="360" y1="178" x2="460" y2="178" stroke="#C8102E" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="465" y="174" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#C8102E">E (exact)</text>
  <line x1="170" y1="278" x2="170" y2="214" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#ar-pc)"/>
  <text x="178" y="252" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">λE¹</text>
  <line x1="300" y1="208" x2="380" y2="190" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#ar-pc)"/>
  <text x="318" y="186" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">λ²E²</text>
  <rect x="120" y="92" width="392" height="40" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="132" y="117" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">E¹ₙ = ⟨n⁰|H′|n⁰⟩   E²ₙ = Σₘ≠ₙ |⟨m⁰|H′|n⁰⟩|² ∕ (E⁰ₙ − E⁰ₘ)</text>
  <text x="28" y="360" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454"><tspan x="28" dy="0">Each order adds a smaller correction; the series converges</tspan><tspan x="28" dy="15">on the true energy when λH′ is small.</tspan></text>
  
</svg>
