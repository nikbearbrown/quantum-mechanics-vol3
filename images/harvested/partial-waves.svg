<svg role="img" aria-labelledby="t-partial-waves" viewBox="0 0 560 416" xmlns="http://www.w3.org/2000/svg">
  <title id="t-partial-waves">Partial-wave phase shift</title>
  <desc>A free radial wave shown as a dashed sinusoid and the phase-shifted scattered wave shown as a solid sinusoid pulled inward by an attractive potential; the horizontal displacement between them is the phase shift delta over k, marked over the potential range a.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 3</provenance></metadata>
  <defs>
    <marker id="ar-pw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="416" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Partial-wave phase shift (attractive, δ &gt; 0)</text>
  <rect x="28" y="52" width="504" height="288" fill="#F5F5F5" stroke="#D4D4D4"/>
  <line x1="70" y1="200" x2="510" y2="200" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#ar-pw)"/>
  <text x="498" y="220" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">r</text>
  <!-- potential range a marker -->
  <line x1="150" y1="90" x2="150" y2="310" stroke="#ADADAD" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="142" y="104" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">a</text>
  <text x="76" y="104" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">potential range</text>
  <!-- free wave: sin(kr), dashed -->
  <path d="M70,200 Q110,120 150,200 Q190,280 230,200 Q270,120 310,200 Q350,280 390,200 Q430,120 470,200" fill="none" stroke="#787878" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="406" y="128" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">sin(kr)</text>
  <!-- shifted wave: sin(kr + delta), pulled inward (solid, red) -->
  <path d="M70,200 Q102,120 134,200 Q166,280 198,200 Q230,120 262,200 Q294,280 326,200 Q358,120 390,200 Q422,280 454,200" fill="none" stroke="#C8102E" stroke-width="2"/>
  <text x="320" y="290" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#C8102E">sin(kr + δ_ℓ)</text>
  <!-- phase shift displacement -->
  <line x1="230" y1="320" x2="198" y2="320" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar-pw)"/>
  <text x="200" y="338" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#2a1a0e">δ_ℓ ∕ k (pulled in)</text>
  <!-- amplitude formula -->
  <text x="70" y="80" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">f(θ) = (1∕k) Σ_ℓ (2ℓ+1) e^{iδ_ℓ} sin δ_ℓ P_ℓ(cosθ)</text>
  <text x="28" y="360" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454"><tspan x="28" dy="0">An attractive potential advances the outgoing wave (δ &gt; 0);</tspan><tspan x="28" dy="15">each ℓ-channel is summarised by one real phase shift.</tspan></text>
  
</svg>
