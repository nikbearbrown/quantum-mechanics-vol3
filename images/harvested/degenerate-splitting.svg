<svg role="img" aria-labelledby="t-degenerate-splitting" viewBox="0 0 560 416" xmlns="http://www.w3.org/2000/svg">
  <title id="t-degenerate-splitting">Degenerate perturbation lifts a level into a split multiplet</title>
  <desc>A single degenerate energy level holding several states splits, under a perturbation, into distinct sub-levels whose separations are the eigenvalues of the perturbation in the degenerate subspace.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 3</provenance></metadata>
  <defs>
    <marker id="ar-ds" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="416" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Degenerate perturbation: a level splits</text>
  <rect x="28" y="52" width="504" height="288" fill="#F5F5F5" stroke="#D4D4D4"/>
  <text x="115" y="92" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">H₀ (degenerate)</text>
  <line x1="60" y1="200" x2="170" y2="200" stroke="#2a1a0e" stroke-width="2.5"/>
  <text x="60" y="190" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E⁰  (g = 3)</text>
  <circle cx="90" cy="200" r="3" fill="#2a1a0e"/><circle cx="115" cy="200" r="3" fill="#2a1a0e"/><circle cx="140" cy="200" r="3" fill="#2a1a0e"/>
  <text x="425" y="92" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">H₀ + λH′</text>
  <line x1="370" y1="150" x2="480" y2="150" stroke="#787878" stroke-width="2"/>
  <text x="486" y="154" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E⁰+λE¹₊</text>
  <line x1="370" y1="200" x2="480" y2="200" stroke="#787878" stroke-width="2"/>
  <text x="486" y="204" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">E⁰+λE¹₀</text>
  <line x1="370" y1="252" x2="480" y2="252" stroke="#C8102E" stroke-width="2.5"/>
  <text x="486" y="256" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#C8102E">E⁰+λE¹₋</text>
  <line x1="170" y1="200" x2="370" y2="150" stroke="#ADADAD" stroke-width="1"/>
  <line x1="170" y1="200" x2="370" y2="200" stroke="#ADADAD" stroke-width="1"/>
  <line x1="170" y1="200" x2="370" y2="252" stroke="#ADADAD" stroke-width="1"/>
  <line x1="525" y1="150" x2="525" y2="252" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar-ds)"/>
  <line x1="525" y1="252" x2="525" y2="150" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar-ds)"/>
  <text x="505" y="205" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">ΔE</text>
  <rect x="100" y="288" width="360" height="34" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="112" y="310" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">det(⟨i|H′|j⟩ − E¹δᵢⱼ) = 0  →  E¹ are eigenvalues</text>
  <text x="28" y="360" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454"><tspan x="28" dy="0">The perturbation must be diagonalized within the degenerate subspace;</tspan><tspan x="28" dy="15">its eigenvalues are the first-order shifts.</tspan></text>
  
</svg>
